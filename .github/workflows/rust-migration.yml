name: Rust migration verification

on:
  push:
    branches:
      - "migration/rust-max-coverage-*"
  pull_request:
    paths:
      - "rust/**"
      - "scripts/check_rust_mcp_parity.py"
      - "sfsymbols/src/commonMain/kotlin/com/composables/sfsymbols/SfSymbolsCatalog.kt"
      - "app/src/jvmMain/resources/symbol_tags.txt"
      - "app/src/**"
      - "sfsymbols/src/**"
      - "app/build.gradle.kts"
      - "sfsymbols/build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/**"
      - "kotlin-js-store/**"
      - ".github/workflows/rust-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust core and MCP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace
      - name: Rust static analysis
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

  parity:
    name: Differential replay against Kotlin MCP
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build reference Kotlin MCP server
        run: ./gradlew :app:assembleMcp --no-daemon
      - name: Build Rust MCP server
        run: cargo build --manifest-path rust/Cargo.toml -p sfstudio-mcp
      - name: Differential replay
        run: python3 scripts/check_rust_mcp_parity.py

  kmp-jvm:
    name: Existing JVM and Compose APIs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: JVM app and public library tests (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew :app:jvmTest :sfsymbols:jvmTest --no-daemon
      - name: JVM app and public library tests (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat :app:jvmTest :sfsymbols:jvmTest --no-daemon

  kmp-web:
    name: Existing JS and Wasm targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Yarn
        run: |
          mkdir -p "$RUNNER_TEMP/yarn-shims"
          corepack enable yarn --install-directory "$RUNNER_TEMP/yarn-shims"
          corepack prepare yarn@1.22.22 --activate
          echo "$RUNNER_TEMP/yarn-shims" >> "$GITHUB_PATH"
      - name: JS and Wasm tests
        run: ./gradlew :sfsymbols:jsNodeTest :sfsymbols:wasmJsNodeTest --no-daemon -PsfstudioUseSystemWebTools=true

  kmp-android:
    name: Existing Android target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android API 37
        run: sdkmanager "platforms;android-37"
      - name: Android library compilation
        run: ./gradlew :sfsymbols:compileAndroidMain --no-daemon

  kmp-ios:
    name: Existing iOS targets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: iOS device and simulator compilation
        run: ./gradlew :sfsymbols:compileKotlinIosArm64 :sfsymbols:compileKotlinIosSimulatorArm64 --no-daemon
