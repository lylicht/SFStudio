name: Rust migration verification

on:
  push:
    branches:
      - "migration/rust-max-coverage-*"
  pull_request:
    paths:
      - "rust/**"
      - "include/sfstudio.h"
      - "scripts/check_rust_mcp_parity.py"
      - "scripts/test_rust_ffi.py"
      - "scripts/test_mcp.py"
      - "scripts/mcp.*"
      - "sfsymbols/src/commonMain/kotlin/com/composables/sfsymbols/SfSymbolsCatalog.kt"
      - "app/src/jvmMain/resources/symbol_tags.txt"
      - "app/src/**"
      - "sfsymbols/src/**"
      - "buildSrc/**"
      - "app/build.gradle.kts"
      - "sfsymbols/build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/**"
      - "kotlin-js-store/**"
      - ".github/workflows/rust-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust core and MCP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace
      - name: Rust static analysis
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Build language-neutral C ABI
        run: cargo build --manifest-path rust/Cargo.toml -p sfstudio-ffi
      - name: Exercise C ABI from Python (Windows)
        if: runner.os == 'Windows'
        run: python scripts/test_rust_ffi.py
      - name: Exercise C ABI from Python (Unix)
        if: runner.os != 'Windows'
        run: python3 scripts/test_rust_ffi.py

  parity:
    name: Differential replay against Kotlin MCP
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build reference Kotlin MCP server
        run: ./gradlew :app:assembleMcp --no-daemon
      - name: Build Rust MCP server
        run: cargo build --manifest-path rust/Cargo.toml -p sfstudio-mcp
      - name: Exercise Rust MCP through the existing --mcp launcher
        run: python3 scripts/test_mcp.py --rust-binary rust/target/debug/sfstudio-mcp
      - name: Differential replay
        run: python3 scripts/check_rust_mcp_parity.py

  kmp-jvm:
    name: Existing JVM and Compose APIs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: JVM app and public library tests (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew :app:jvmTest :sfsymbols:jvmTest --no-daemon
      - name: JVM app and public library tests (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat :app:jvmTest :sfsymbols:jvmTest --no-daemon

  desktop-bundled-mcp:
    name: Packaged Rust MCP entrypoint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build desktop app image (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat :app:createDistributable --no-daemon
      - name: Build desktop app image (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew :app:createDistributable --no-daemon
      - name: Exercise packaged MCP launcher (Windows)
        if: runner.os == 'Windows'
        run: python scripts/test_mcp.py --launcher app/build/compose/binaries/main/app/SFStudio/SFStudio.exe
      - name: Exercise packaged MCP launcher (Linux)
        if: runner.os == 'Linux'
        run: python3 scripts/test_mcp.py --launcher app/build/compose/binaries/main/app/SFStudio/bin/SFStudio
      - name: Exercise packaged MCP launcher (macOS)
        if: runner.os == 'macOS'
        run: python3 scripts/test_mcp.py --launcher app/build/compose/binaries/main/app/SFStudio.app/Contents/MacOS/SFStudio

  kmp-web:
    name: Existing JS and Wasm targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Yarn
        run: |
          mkdir -p "$RUNNER_TEMP/yarn-shims"
          corepack enable yarn --install-directory "$RUNNER_TEMP/yarn-shims"
          corepack prepare yarn@1.22.22 --activate
          echo "$RUNNER_TEMP/yarn-shims" >> "$GITHUB_PATH"
      - name: JS and Wasm tests
        run: ./gradlew :sfsymbols:jsNodeTest :sfsymbols:wasmJsNodeTest --no-daemon -PsfstudioUseSystemWebTools=true

  kmp-android:
    name: Android target and Rust JNI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android API 37 and NDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "ndk;28.2.13676358"
      - name: Select Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Android Kotlin compilation and Rust ABI packaging
        run: ./gradlew :sfsymbols:compileAndroidMain :sfsymbols:assembleAndroidMain --no-daemon
      - name: Exercise Rust JNI on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          cores: 4
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :sfsymbols:connectedAndroidDeviceTest --no-daemon

  kmp-ios:
    name: Existing iOS targets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: iOS device and simulator compilation
        run: ./gradlew :sfsymbols:compileKotlinIosArm64 :sfsymbols:compileKotlinIosSimulatorArm64 --no-daemon
