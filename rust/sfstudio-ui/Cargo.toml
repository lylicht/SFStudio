[package]
name = "sfstudio-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.95"
publish = false

[dependencies]
sfstudio-core = { path = "../sfstudio-core" }
slint = { version = "=1.19.0", default-features = false, features = ["compat-1-18", "std", "backend-default", "renderer-femtovg", "renderer-software", "accessibility"] }

[build-dependencies]
slint-build = { version = "=1.19.0", default-features = false, features = ["compat-1-18", "renderer-software"] }
